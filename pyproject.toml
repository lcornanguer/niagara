[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "niagara-cd"
version = "0.2.0"
description = "Causal discovery from interval-based event sequences"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Lénaïg Cornanguer" },
  { name = "Joscha Cüppers" },
  { name = "Jilles Vreeken" },
]
keywords = ["causal discovery", "event sequences", "interval data", "MDL"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = [
  "pandas>=2.0",
  "pytest>=8",
]
release = [
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
niagara = "niagara.cli:main"

[project.urls]
Homepage = "https://eda.rg.cispa.io/prj/niagara/"
Repository = "https://github.com/lcornanguer/niagara"

[tool.hatch.build.targets.wheel]
packages = ["src/niagara"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/CITATION.cff",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
